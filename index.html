<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">

  <title></title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>


  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }


    /* =========================================
       MINDAR UI
    ========================================= */

    .mindar-ui-overlay,
    .mindar-ui-loading {

      background:
        rgba(0, 0, 0, 0.4) !important;

      backdrop-filter:
        blur(20px) !important;

      -webkit-backdrop-filter:
        blur(20px) !important;
    }


    .mindar-ui-loading .loader {

      border:
        3px solid
        rgba(255, 255, 255, 0.2) !important;

      border-top-color:
        #ffffff !important;
    }


    /* =========================================
       START BUTTON
    ========================================= */

    #start-btn {

      position: absolute;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      z-index: 99999;

      padding:
        16px 32px;

      font-size:
        18px;

      font-weight:
        bold;

      color:
        #ffffff;

      text-shadow:
        0 2px 4px
        rgba(0, 0, 0, 0.8);

      background:
        rgba(0, 0, 0, 0.35);

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);

      border:
        1px solid
        rgba(255, 255, 255, 0.3);

      border-radius:
        30px;

      cursor:
        pointer;

      box-shadow:
        0 8px 32px
        rgba(0, 0, 0, 0.4);

      transition:
        all 0.3s ease;

      -webkit-tap-highlight-color:
        transparent;
    }


    #start-btn:active {

      transform:
        translate(-50%, -50%)
        scale(0.95);

      background:
        rgba(0, 0, 0, 0.5);
    }

  </style>


  <script>

    /*
    ==========================================================
    ОПРЕДЕЛЯЕМ ПРОПОРЦИЮ TARGET
    ==========================================================
    */

    let targetWidth = 1;
    let targetHeight = 1;


    function getTargetRatio() {

      return new Promise(
        (resolve, reject) => {

          const image =
            new Image();


          image.onload = function () {

            const width =
              image.naturalWidth;

            const height =
              image.naturalHeight;


            if (
              !width ||
              !height
            ) {

              reject(
                new Error(
                  'Не удалось получить размеры target.jpg'
                )
              );

              return;
            }


            /*
            Всегда оставляем ширину = 1.

            Например:

            1080 × 1920

            1920 / 1080
            =
            1.7777

            Получаем:

            1 × 1.7777
            */

            targetWidth = 1;

            targetHeight =
              height / width;


            console.log(
              'TARGET:',
              width,
              '×',
              height
            );


            console.log(
              'AR:',
              targetWidth,
              '×',
              targetHeight
            );


            resolve();

          };


          image.onerror =
            function () {

              reject(
                new Error(
                  'target.jpg не найден'
                )
              );

            };


          image.src =
            './target.jpg?v=' +
            Date.now();

        }
      );

    }


    /*
    ==========================================================
    AR COMPONENT
    ==========================================================
    */

    AFRAME.registerComponent(
      'ar-video-handler',
      {

        init: function () {

          const el =
            this.el;


          const video =
            document.querySelector(
              '#ar-video'
            );


          const videoPlane =
            document.querySelector(
              '#ar-video-plane'
            );


          const startBtn =
            document.querySelector(
              '#start-btn'
            );


          /*
          ==============================================
          Получаем размер фотографии
          ==============================================
          */

          getTargetRatio()
            .then(
              function () {

                videoPlane.setAttribute(
                  'width',
                  targetWidth
                );


                videoPlane.setAttribute(
                  'height',
                  targetHeight
                );


                console.log(
                  'Размер видео установлен'
                );

              }
            )
            .catch(
              function (error) {

                console.error(
                  error
                );

                /*
                Резервный вариант.
                */

                videoPlane.setAttribute(
                  'width',
                  1
                );

                videoPlane.setAttribute(
                  'height',
                  1
                );

              }
            );


          /*
          ==============================================
          ПЕРВЫЙ КЛИК
          ==============================================
          */

          startBtn.addEventListener(
            'click',
            function () {

              video.play()
                .then(
                  function () {

                    video.pause();

                    startBtn.style.display =
                      'none';

                  }
                )
                .catch(
                  function (error) {

                    console.error(
                      error
                    );

                    startBtn.style.display =
                      'none';

                  }
                );

            }
          );


          /*
          ==============================================
          TARGET FOUND
          ==============================================
          */

          el.addEventListener(
            'targetFound',
            function () {

              console.log(
                'TARGET FOUND'
              );


              video.muted =
                false;


              const playPromise =
                video.play();


              if (
                playPromise !== undefined
              ) {

                playPromise.catch(
                  function (error) {

                    console.log(
                      'Video play error:',
                      error
                    );

                  }
                );

              }

            }
          );


          /*
          ==============================================
          TARGET LOST
          ==============================================
          */

          el.addEventListener(
            'targetLost',
            function () {

              console.log(
                'TARGET LOST'
              );


              video.pause();

            }
          );

        }

      }
    );

  </script>

</head>


<body>


  <!-- =========================================
       START
  ========================================== -->

  <button id="start-btn">
    Нажмите, чтобы начать
  </button>


  <!-- =========================================
       MINDAR
  ========================================== -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true,
      physicallyCorrectLights: false
    "

    vr-mode-ui="
      enabled: false
    "

    device-orientation-permission-ui="
      enabled: false
    "

  >


    <!-- =======================================
         ASSETS
    ======================================== -->

    <a-assets>

      <video

        id="ar-video"

        src="video.mp4"

        preload="auto"

        loop="true"

        crossorigin="anonymous"

        playsinline

        webkit-playsinline

        muted

      ></video>

    </a-assets>


    <!-- =======================================
         CAMERA
    ======================================== -->

    <a-camera

      position="0 0 0"

      look-controls="
        enabled: false
      "

    ></a-camera>


    <!-- =======================================
         TARGET
    ======================================== -->

    <a-entity

      mindar-image-target="
        targetIndex: 0
      "

      ar-video-handler

    >

      <!-- =====================================
           VIDEO
      ====================================== -->

      <a-video

        id="ar-video-plane"

        src="#ar-video"

        position="
          0 0 0.01
        "

        rotation="
          0 0 0
        "

        material="
          shader: flat;
          src: #ar-video;
        "

      ></a-video>

    </a-entity>


  </a-scene>

</body>
</html>
