<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">

  <title>AR Scanner</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;
    }


    /* =========================================
       MINDAR LOADING
    ========================================= */

    .mindar-ui-overlay,
    .mindar-ui-loading {

      background:
        rgba(0, 0, 0, 0.4) !important;

      backdrop-filter:
        blur(20px) !important;

      -webkit-backdrop-filter:
        blur(20px) !important;
    }


    .mindar-ui-loading .loader {

      border:
        3px solid
        rgba(255, 255, 255, 0.2) !important;

      border-top-color:
        #ffffff !important;
    }


    /* =========================================
       START BUTTON
    ========================================= */

    #start-btn {

      position: absolute;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      z-index: 99999;

      padding:
        16px 32px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

      font-size: 18px;

      font-weight: bold;

      color: #ffffff;

      text-shadow:
        0 2px 4px
        rgba(0, 0, 0, 0.8);

      background:
        rgba(0, 0, 0, 0.35);

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);

      border:
        1px solid
        rgba(255, 255, 255, 0.3);

      border-radius:
        30px;

      cursor: pointer;

      box-shadow:
        0 8px 32px
        rgba(0, 0, 0, 0.4);

      transition:
        all 0.3s ease;

      -webkit-tap-highlight-color:
        transparent;
    }


    #start-btn:active {

      transform:
        translate(-50%, -50%)
        scale(0.95);

      background:
        rgba(0, 0, 0, 0.5);
    }


    /* =========================================
       LINK BUTTON
    ========================================= */

    #link-btn {

      display: none;

      position: absolute;

      bottom: 35px;
      left: 50%;

      transform:
        translateX(-50%);

      z-index: 99999;

      align-items: center;
      justify-content: center;

      gap: 10px;

      padding:
        14px 28px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

      font-size: 15px;

      font-weight: 600;

      letter-spacing: 0.3px;

      color: #ffffff;

      text-decoration: none;

      white-space: nowrap;

      text-shadow:
        0 2px 4px
        rgba(0, 0, 0, 0.8);

      background:
        rgba(0, 0, 0, 0.35);

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);

      border:
        1px solid
        rgba(255, 255, 255, 0.3);

      border-radius:
        50px;

      box-shadow:
        0 8px 32px
        rgba(0, 0, 0, 0.4);

      transition:
        all 0.3s
        cubic-bezier(
          0.25,
          0.8,
          0.25,
          1
        );

      -webkit-tap-highlight-color:
        transparent;
    }


    #link-btn:active {

      transform:
        translateX(-50%)
        scale(0.95);

      background:
        rgba(0, 0, 0, 0.5);

      border-color:
        rgba(255, 255, 255, 0.5);
    }


    #link-btn svg {

      width: 18px;
      height: 18px;

      fill: none;

      stroke: currentColor;

      stroke-width: 2.2;

      stroke-linecap: round;
      stroke-linejoin: round;

      filter:
        drop-shadow(
          0 2px 3px
          rgba(0, 0, 0, 0.8)
        );
    }


    /* =========================================
       A-FRAME
    ========================================= */

    a-scene {

      position: fixed !important;

      top: 0;
      left: 0;

      width: 100% !important;
      height: 100% !important;
    }

  </style>


  <script>

    /*
    ==========================================================
    АВТОМАТИЧЕСКОЕ ОПРЕДЕЛЕНИЕ ПРОПОРЦИИ ФОТО
    ==========================================================

    В папке должна лежать:

        target.jpg

    Это оригинальная фотография,
    которую ты использовал для создания targets.mind.

    Например:

        target.jpg
        1080 × 1920

    Скрипт автоматически получит:

        width  = 1080
        height = 1920

    И преобразует их в пропорцию:

        0.5625 : 1

    ==========================================================
    */


    let targetWidth = 1;
    let targetHeight = 1;


    function loadTargetDimensions() {

      return new Promise(
        (resolve, reject) => {

          const image =
            new Image();


          image.onload = function () {

            const width =
              image.naturalWidth;

            const height =
              image.naturalHeight;


            console.log(
              'Размер target:',
              width,
              '×',
              height
            );


            if (
              !width ||
              !height
            ) {

              reject(
                new Error(
                  'Не удалось определить размер target.jpg'
                )
              );

              return;
            }


            /*
            ==========================================
            Нормализуем размер.

            Ширина всегда = 1.

            Высота рассчитывается
            относительно ширины.
            ==========================================
            */

            targetWidth = 1;

            targetHeight =
              height / width;


            console.log(
              'AR пропорция:',
              targetWidth,
              ':',
              targetHeight
            );


            resolve();

          };


          image.onerror =
            function () {

              reject(
                new Error(
                  'Не удалось загрузить target.jpg'
                )
              );

            };


          /*
          Добавляем cache-buster,
          чтобы браузер не использовал
          старую фотографию.
          */

          image.src =
            './target.jpg?v=' +
            Date.now();

        }
      );

    }


    /*
    ==========================================================
    AR VIDEO HANDLER
    ==========================================================
    */

    AFRAME.registerComponent(
      'ar-video-handler',
      {

        init: function () {

          const target =
            this.el;


          const video =
            document.querySelector(
              '#ar-video'
            );


          const videoPlane =
            document.querySelector(
              '#ar-video-plane'
            );


          const startBtn =
            document.querySelector(
              '#start-btn'
            );


          /*
          ==============================================
          Загружаем размеры фотографии
          ==============================================
          */

          loadTargetDimensions()
            .then(
              function () {

                /*
                Устанавливаем размер
                AR-плоскости.
                */

                videoPlane.setAttribute(
                  'width',
                  targetWidth
                );


                videoPlane.setAttribute(
                  'height',
                  targetHeight
                );


                console.log(
                  'Размер AR-видео установлен:',
                  targetWidth,
                  '×',
                  targetHeight
                );

              }
            )
            .catch(
              function (error) {

                console.error(
                  error
                );


                /*
                Если target.jpg
                не найден,

                используем стандартный
                формат 1:1.
                */

                videoPlane.setAttribute(
                  'width',
                  1
                );

                videoPlane.setAttribute(
                  'height',
                  1
                );

              }
            );


          /*
          ==============================================
          КНОПКА СТАРТА
          ==============================================
          */

          startBtn.addEventListener(
            'click',
            function () {

              video.play()
                .then(
                  function () {

                    video.pause();

                    startBtn.style.display =
                      'none';

                  }
                )
                .catch(
                  function (error) {

                    console.error(
                      'Ошибка разблокировки видео:',
                      error
                    );

                    startBtn.style.display =
                      'none';

                  }
                );

            }
          );


          /*
          ==============================================
          TARGET FOUND
          ==============================================
          */

          target.addEventListener(
            'targetFound',
            function () {

              console.log(
                'TARGET FOUND'
              );


              /*
              Включаем звук.
              */

              video.muted =
                false;


              /*
              Запускаем видео.
              */

              const playPromise =
                video.play();


              if (
                playPromise !== undefined
              ) {

                playPromise.catch(
                  function (error) {

                    console.log(
                      'Play error:',
                      error
                    );

                  }
                );

              }

            }
          );


          /*
          ==============================================
          TARGET LOST
          ==============================================
          */

          target.addEventListener(
            'targetLost',
            function () {

              console.log(
                'TARGET LOST'
              );


              video.pause();

            }
          );

        }

      }
    );

  </script>

</head>


<body>


  <!-- =========================================
       START
  ========================================== -->

  <button id="start-btn">
    Нажмите, чтобы начать
  </button>


  <!-- =========================================
       AR SCENE
  ========================================== -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true,
      physicallyCorrectLights: false
    "

    vr-mode-ui="
      enabled: false
    "

    device-orientation-permission-ui="
      enabled: false
    "

  >


    <!-- =======================================
         VIDEO
    ======================================== -->

    <a-assets>

      <video

        id="ar-video"

        src="video.mp4"

        preload="auto"

        loop="true"

        crossorigin="anonymous"

        playsinline

        webkit-playsinline

        muted

      ></video>

    </a-assets>


    <!-- =======================================
         CAMERA
    ======================================== -->

    <a-camera

      position="0 0 0"

      look-controls="
        enabled: false
      "

    ></a-camera>


    <!-- =======================================
         TARGET
    ======================================== -->

    <a-entity

      mindar-image-target="
        targetIndex: 0
      "

      ar-video-handler

    >


      <!-- =====================================
           VIDEO
      ====================================== -->

      <a-video

        id="ar-video-plane"

        src="#ar-video"

        position="
          0 0 0.01
        "

        rotation="
          0 0 0
        "

        material="
          shader: flat;
          src: #ar-video;
        "

      ></a-video>


    </a-entity>


  </a-scene>

</body>
</html>
