<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">

  <title>AR Scanner</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* =========================================
       MINDAR LOADING
    ========================================= */

    .mindar-ui-overlay,
    .mindar-ui-loading {
      background: rgba(0, 0, 0, 0.4) !important;

      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
    }

    .mindar-ui-loading .loader {
      border: 3px solid rgba(255, 255, 255, 0.2) !important;
      border-top-color: #ffffff !important;
    }


    /* =========================================
       START BUTTON
    ========================================= */

    #start-btn {
      position: fixed;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      z-index: 99999;

      padding: 16px 32px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

      font-size: 18px;
      font-weight: 600;

      color: #fff;

      text-shadow:
        0 2px 4px rgba(0, 0, 0, 0.8);

      background: rgba(0, 0, 0, 0.35);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      border: 1px solid rgba(255, 255, 255, 0.3);

      border-radius: 30px;

      cursor: pointer;

      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.4);

      transition:
        transform 0.3s ease,
        background 0.3s ease;

      -webkit-tap-highlight-color: transparent;
    }

    #start-btn:active {
      transform:
        translate(-50%, -50%)
        scale(0.95);

      background: rgba(0, 0, 0, 0.5);
    }


    /* =========================================
       LINK BUTTON
    ========================================= */

    #link-btn {
      display: none;

      position: fixed;

      bottom: 35px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 99999;

      align-items: center;
      justify-content: center;

      gap: 10px;

      padding: 14px 28px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

      font-size: 15px;
      font-weight: 600;

      letter-spacing: 0.3px;

      color: #fff;

      text-decoration: none;

      white-space: nowrap;

      text-shadow:
        0 2px 4px rgba(0, 0, 0, 0.8);

      background: rgba(0, 0, 0, 0.35);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      border: 1px solid rgba(255, 255, 255, 0.3);

      border-radius: 50px;

      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.4);

      transition:
        transform 0.3s ease,
        background 0.3s ease;

      -webkit-tap-highlight-color: transparent;
    }

    #link-btn:active {
      transform:
        translateX(-50%)
        scale(0.95);

      background: rgba(0, 0, 0, 0.5);
    }

    #link-btn svg {
      width: 18px;
      height: 18px;

      fill: none;

      stroke: currentColor;

      stroke-width: 2.2;

      stroke-linecap: round;
      stroke-linejoin: round;

      filter:
        drop-shadow(
          0 2px 3px rgba(0, 0, 0, 0.8)
        );
    }


    /* =========================================
       AR
    ========================================= */

    a-scene {
      width: 100%;
      height: 100%;
    }
  </style>


  <script>

    /*
    ==========================================================
    НАСТРОЙКА ПРОПОРЦИЙ ФОТОГРАФИИ
    ==========================================================

    Здесь задаётся пропорция изображения, которое сканируется.

    Например:

    1000 × 1300
    => 1 : 1.3

    1000 × 1500
    => 1 : 1.5

    1200 × 800
    => 1.5 : 1

    1080 × 1920
    => 0.5625 : 1

    ==========================================================
    */

    const TARGET_WIDTH = 1;
    const TARGET_HEIGHT = 1.3;


    AFRAME.registerComponent('ar-video-handler', {

      init: function () {

        const target = this.el;

        const video =
          document.querySelector('#ar-video');

        const videoPlane =
          document.querySelector('#ar-video-plane');

        const startBtn =
          document.querySelector('#start-btn');

        const linkBtn =
          document.querySelector('#link-btn');


        /*
        ======================================================
        УСТАНАВЛИВАЕМ РАЗМЕР ВИДЕО ПО РАЗМЕРУ ФОТО
        ======================================================
        */

        videoPlane.setAttribute(
          'width',
          TARGET_WIDTH
        );

        videoPlane.setAttribute(
          'height',
          TARGET_HEIGHT
        );


        /*
        ======================================================
        СТАРТОВАЯ КНОПКА
        ======================================================
        */

        startBtn.addEventListener(
          'click',
          async () => {

            try {

              /*
              Разблокируем воспроизведение
              после пользовательского клика.
              */

              await video.play();

              video.pause();

              startBtn.style.display = 'none';

              /*
              Кнопку сайта здесь можно включить,
              если она понадобится.
              */

              // linkBtn.style.display = 'inline-flex';

            }

            catch (error) {

              console.error(
                'Ошибка разблокировки видео:',
                error
              );

              startBtn.style.display = 'none';

            }

          }
        );


        /*
        ======================================================
        ФОТО НАЙДЕНО
        ======================================================
        */

        target.addEventListener(
          'targetFound',
          () => {

            console.log(
              'AR target найден'
            );


            /*
            Включаем звук.
            */

            video.muted = false;


            /*
            Запускаем видео.
            */

            const playPromise =
              video.play();


            if (playPromise !== undefined) {

              playPromise.catch(
                error => {

                  console.log(
                    'Ошибка запуска видео:',
                    error
                  );

                }
              );

            }

          }
        );


        /*
        ======================================================
        ФОТО ПОТЕРЯНО
        ======================================================
        */

        target.addEventListener(
          'targetLost',
          () => {

            console.log(
              'AR target потерян'
            );


            /*
            Останавливаем видео,
            когда фотография исчезла
            из камеры.
            */

            video.pause();

          }
        );

      }

    });

  </script>

</head>


<body>


  <!-- =========================================
       КНОПКА СТАРТА
  ========================================== -->

  <button id="start-btn">
    Нажмите, чтобы начать
  </button>


  <!-- =========================================
       КНОПКА САЙТА

       Сейчас скрыта.

       Если понадобится:
       убери display:none
       через JS после запуска.
  ========================================== -->

  <a
    id="link-btn"
    href="#"
    target="_blank"
  >

    <svg
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        d="M14 3h7v7"
      />

      <path
        d="M10 14L21 3"
      />

      <path
        d="M21 14v5
           a2 2 0 0 1-2 2
           H5
           a2 2 0 0 1-2-2
           V5
           a2 2 0 0 1 2-2
           h5"
      />
    </svg>

    Открыть сайт

  </a>


  <!-- =========================================
       AR SCENE
  ========================================== -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true,
      physicallyCorrectLights: false
    "

    vr-mode-ui="
      enabled: false
    "

    device-orientation-permission-ui="
      enabled: false
    "

    embedded

  >


    <!-- =======================================
         VIDEO ASSET
    ======================================== -->

    <a-assets>

      <video

        id="ar-video"

        src="video.mp4"

        preload="auto"

        loop

        crossorigin="anonymous"

        playsinline

        webkit-playsinline

        muted

      ></video>

    </a-assets>


    <!-- =======================================
         CAMERA
    ======================================== -->

    <a-camera

      position="0 0 0"

      look-controls="
        enabled: false
      "

    ></a-camera>


    <!-- =======================================
         TARGET
    ======================================== -->

    <a-entity

      mindar-image-target="
        targetIndex: 0
      "

      ar-video-handler

    >


      <!-- =====================================
           ВИДЕО

           Размер автоматически берётся
           из TARGET_WIDTH / TARGET_HEIGHT
           выше.
      ====================================== -->

      <a-video

        id="ar-video-plane"

        src="#ar-video"

        position="0 0 0.01"

        rotation="0 0 0"

        material="
          shader: flat;
          src: #ar-video;
        "

      ></a-video>


    </a-entity>


  </a-scene>

</body>
</html>
